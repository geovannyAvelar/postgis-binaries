name: Build PostGIS binaries

on:
  workflow_dispatch:
    inputs:
      postgis_version:
        description: 'PostGIS version tag to build (e.g. 3.5.7)'
        required: true
      platforms:
        description: 'Which platforms to build'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - macos
          - windows
          - all
      publish:
        description: 'Publish a release when the builds and tests pass (off: only build and test)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        run: |
          # Only workflow_dispatch carries a "platforms" input; a tag push
          # has none, and defaults to building everything. macOS/Windows are
          # unvalidated as of writing -- see the repo README -- so a manual
          # run defaults to linux-only unless told otherwise.
          selection="${{ github.event.inputs.platforms || 'all' }}"

          # Linux builds run in an AlmaLinux 9 container (glibc 2.34, older
          # than the theseus-rs binaries' own 2.36), so the result runs
          # everywhere the PostgreSQL it overlays runs. See build-linux.sh.
          linux='{"os":"ubuntu-24.04","container":"almalinux:9","target":"x86_64-unknown-linux-gnu","script":"build-linux.sh"},{"os":"ubuntu-24.04-arm","container":"almalinux:9","target":"aarch64-unknown-linux-gnu","script":"build-linux.sh"}'
          macos='{"os":"macos-13","target":"x86_64-apple-darwin","script":"build-macos.sh"},{"os":"macos-14","target":"aarch64-apple-darwin","script":"build-macos.sh"}'
          windows='{"os":"windows-latest","target":"x86_64-pc-windows-msvc","script":"build-windows.sh"}'

          case "$selection" in
            linux) entries="$linux" ;;
            macos) entries="$macos" ;;
            windows) entries="$windows" ;;
            all) entries="$linux,$macos,$windows" ;;
            *) echo "unknown platforms selection: $selection" >&2; exit 1 ;;
          esac

          echo "platforms=[$entries]" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform.target }} / PG${{ matrix.pg_major }}
    needs: [setup]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['13', '14', '15', '16', '17', '18']
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
    # Empty (no container) for macOS and Windows.
    container: ${{ matrix.platform.container }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # json-c-devel is in CRB, patchelf in EPEL.
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing \
            ca-certificates curl git \
            json-c-devel libxml2-devel sqlite-devel sqlite \
            autoconf automake libtool patchelf pkgconf-pkg-config perl cmake \
            gcc gcc-c++ make binutils file xz findutils which diffutils bison flex

      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            zip

      - name: Determine PostGIS version to build
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.postgis_version }}" ]; then
            echo "version=${{ github.event.inputs.postgis_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.platform.target }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.platform.target }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.platform.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: postgis-${{ steps.version.outputs.version }}-pg${{ matrix.pg_major }}-${{ matrix.platform.target }}
          path: |
            work-*/postgis-*.tar.gz
            work-*/postgis-*.zip
          if-no-files-found: error

  # Installs each Linux archive over its PostgreSQL release on clean
  # distributions -- from the oldest glibc the theseus-rs PostgreSQL itself
  # runs on (Debian 12, 2.36) to current ones -- and runs the smoke test
  # there. Catches a package that needs a newer glibc than the system has,
  # or a library PostgreSQL ships that isn't compatible.
  test-linux:
    name: Test on ${{ matrix.distro }} (${{ matrix.target }})
    needs: [setup, build]
    if: contains(needs.setup.outputs.platforms, 'linux-gnu')
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ['debian:bookworm', 'debian:trixie', 'ubuntu:24.04', 'fedora:41']
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install test dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar gzip passwd util-linux
          else
            dnf install -y ca-certificates tar gzip shadow-utils util-linux --allowerasing
            command -v curl >/dev/null || dnf install -y curl --allowerasing
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: postgis-*-${{ matrix.target }}
          path: artifacts

      - name: Smoke-test every PostgreSQL major
        shell: bash
        run: |
          set -euo pipefail
          archives=$(find artifacts -name "postgis-*-${{ matrix.target }}.tar.gz" | sort)
          [ -n "$archives" ] || { echo "no archives for ${{ matrix.target }}" >&2; exit 1; }
          for archive in $archives; do
            pg_major=$(basename "$archive" | sed -E 's/^postgis-[0-9.]+-pg([0-9]+)-.*/\1/')
            pg_tag=$(./resolve-pg-tag.sh "$pg_major")
            echo "::group::PostgreSQL ${pg_tag}: $(basename "$archive")"
            curl -fsSL -o pg.tar.gz \
              "https://github.com/theseus-rs/postgresql-binaries/releases/download/${pg_tag}/postgresql-${pg_tag}-${{ matrix.target }}.tar.gz"
            ./smoke-test-linux.sh "$archive" pg.tar.gz
            echo "::endgroup::"
          done

  release:
    name: Publish release
    needs: [build, test-linux]
    # A tag push always publishes; a manual run only when asked to, so
    # builds can be tried out without replacing a published release.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.test-linux.result == 'success' || needs.test-linux.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.postgis_version }}" ]; then
            echo "tag=v${{ github.event.inputs.postgis_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*
          # Rebuilding a version replaces its archives in the existing
          # release; pachyderm verifies each against its GitHub digest.
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
