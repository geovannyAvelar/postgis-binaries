name: Build PostGIS binaries

on:
  workflow_dispatch:
    inputs:
      postgis_version:
        description: 'PostGIS version tag to build (e.g. 3.5.7)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }} / PG${{ matrix.pg_major }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['13', '14', '15', '16', '17']
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script: build-linux.sh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            script: build-linux.sh
          - os: macos-13
            target: x86_64-apple-darwin
            script: build-macos.sh
          - os: macos-14
            target: aarch64-apple-darwin
            script: build-macos.sh
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            script: build-windows.sh
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev libproj-dev libjson-c-dev libxml2-dev \
            autoconf automake libtool patchelf pkg-config perl gcc make

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            zip

      - name: Determine PostGIS version to build
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.postgis_version }}" ]; then
            echo "version=${{ github.event.inputs.postgis_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.target }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.target }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh "${{ steps.version.outputs.version }}" "${{ matrix.pg_major }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: postgis-${{ steps.version.outputs.version }}-pg${{ matrix.pg_major }}-${{ matrix.target }}
          path: |
            work-*/postgis-*.tar.gz
            work-*/postgis-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.postgis_version }}" ]; then
            echo "tag=v${{ github.event.inputs.postgis_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
